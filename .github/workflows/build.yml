name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run Build Wrapper
        run: |
          build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build build --config Release

      - name: Normalize Compilation Database
        run: |
          python - <<'PY'
          import json, os, re
          src = 'build/compile_commands.json'
          dst_dir = os.environ.get('BUILD_WRAPPER_OUT_DIR', 'build_wrapper_output_directory')
          dst = os.path.join(dst_dir, 'compile_commands.json')
          os.makedirs(dst_dir, exist_ok=True)
          with open(src, 'r', encoding='utf-8') as f:
              data = json.load(f)
          workspace = os.environ.get('GITHUB_WORKSPACE', os.getcwd()).replace('\\\\', '/')
          def fix_path(s):
              if not isinstance(s, str):
                  return s
              s = s.replace('\\\\', '/')
              s = re.sub(r'C:/Users/[^/]+/Documents/ai-reviewer', workspace, s, flags=re.IGNORECASE)
              return s
          for e in data:
              for k in ('directory','file','command','output'):
                  if k in e:
                      e[k] = fix_path(e[k])
          with open(dst, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          print('Normalized compilation database written to', dst)
          PY

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Provide compilation database only; PR metadata is handled automatically when running on PRs
          args: >
            --define "sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json"

      - name: Wait for SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PROJECT_KEY=vanderraad_ai-reviewer
          URL="https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT_KEY"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            URL="${URL}&pullRequest=${PR_NUMBER}"
            echo "Checking Quality Gate for PR #${PR_NUMBER}"
          else
            echo "Checking Quality Gate for project"
          fi
          echo "Polling SonarCloud for Quality Gate status..."
          for i in $(seq 1 40); do
            resp=$(curl -s -u "${SONAR_TOKEN}:" "$URL")
            status=$(echo "$resp" | jq -r .projectStatus.status)
            echo "Status: $status"
            if [ "$status" = "OK" ] || [ "$status" = "ERROR" ] || [ "$status" = "WARN" ]; then break; fi
            sleep 5
          done
          if [ "$status" != "OK" ]; then
            echo "Quality Gate failed: $status"
            echo "\nQuality Gate conditions:"
            echo "$resp" | jq -r '.projectStatus.conditions[] | "- \(.metricKey): \(.status) (actual=\(.actualValue) threshold=\(.errorThreshold) comparator=\(.comparator))"'
            echo "\nTop unresolved issues (BLOCKER/CRITICAL):"
            curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/issues/search?componentKeys=$PROJECT_KEY&resolved=false&severities=BLOCKER,CRITICAL&ps=5" | jq -r '.issues[] | "- [\(.severity)] \(.message) (\(.component):\(.line)  key=\(.key))"'
            echo "\nSee: https://sonarcloud.io/project/summary?id=$PROJECT_KEY"
            exit 1
          fi

      - name: Publish Sonar summary to GitHub run
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: vanderraad_ai-reviewer
        run: |
          set -e
          echo "## SonarCloud Quality Gate" > $GITHUB_STEP_SUMMARY
          STATUS=$(curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" | jq -r .projectStatus.status)
          echo "- Status: **${STATUS}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Top unresolved issues (severity, file:line, message)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=false&ps=10&severities=BLOCKER,CRITICAL,MAJOR" \
            | jq -r '.issues[] | [.severity, .message, .component, (.line|tostring), .key] | @tsv' \
            | while IFS=$'\t' read -r sev msg comp line key; do
                file=$(echo "$comp" | sed 's/^[^:]*://')
                # Normalize message to a single line for the summary
                msg=$(echo "$msg" | tr '\n' ' ' | sed 's/\r//g')
                # Add markdown to the summary using printf (clean newlines and backticks)
                printf -- "- **%s**\n  - file: `%s:%s`\n  - message: %s\n  - [Open issue](https://sonarcloud.io/project/issues?id=${PROJECT_KEY}&open=%s)\n\n" "$sev" "$file" "$line" "$msg" "$key" >> $GITHUB_STEP_SUMMARY
                # Emit annotations for BLOCKER/CRITICAL so they appear in GitHub UI
                if [ "$sev" = "BLOCKER" ] || [ "$sev" = "CRITICAL" ]; then
                  if [ "$line" != "null" ] && [ -n "$line" ]; then
                    echo "::error file=$file,line=$line::[$sev] $msg (key=$key)"
                  else
                    echo "::error file=$file::[$sev] $msg (key=$key)"
                  fi
                fi
            done
          echo "\nProject: https://sonarcloud.io/project/summary?id=${PROJECT_KEY}" >> $GITHUB_STEP_SUMMARY
      - name: Export Sonar JSON report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: vanderraad_ai-reviewer
        run: |
          set -eo pipefail
          echo "Exporting SonarCloud report..."

          # Fetch quality gate status
          qg=$(curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}")

          # Fetch key measures
          measures=$(curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/measures/component?component=${PROJECT_KEY}&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density")

          # Fetch issues with pagination
          page=1
          page_size=500
          issues_all='[]'
          while :; do
            resp=$(curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/issues/search?componentKeys=${PROJECT_KEY}&resolved=false&ps=${page_size}&p=${page}")
            issues_page=$(echo "$resp" | jq '.issues')
            issues_all=$(jq -s '.[0] + .[1]' <(echo "$issues_all") <(echo "$issues_page"))
            total=$(echo "$resp" | jq -r '.total // .paging.total // 0')
            collected=$(echo "$issues_all" | jq 'length')
            if [ "$collected" -ge "$total" ] || [ $(echo "$issues_page" | jq 'length') -lt $page_size ]; then
              break
            fi
            page=$((page+1))
          done

          # Assemble final report
          jq -n --argjson qg "$qg" --argjson issues "$issues_all" --argjson measures "$measures" '{qualityGate:$qg, issues:$issues, measures:$measures}' > sonar_report.json
          echo "Report written to sonar_report.json (size=$(wc -c < sonar_report.json) bytes)"

      - name: Upload Sonar report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: sonar_report.json