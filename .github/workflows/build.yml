name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run Build Wrapper
        run: |
          build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build build --config Release

      - name: Normalize Compilation Database
        run: |
          python - <<'PY'
          import json, os, re
          src = 'build/compile_commands.json'
          dst_dir = os.environ.get('BUILD_WRAPPER_OUT_DIR', 'build_wrapper_output_directory')
          dst = os.path.join(dst_dir, 'compile_commands.json')
          os.makedirs(dst_dir, exist_ok=True)
          with open(src, 'r', encoding='utf-8') as f:
              data = json.load(f)
          workspace = os.environ.get('GITHUB_WORKSPACE', os.getcwd()).replace('\\\\', '/')
          def fix_path(s):
              if not isinstance(s, str):
                  return s
              s = s.replace('\\\\', '/')
              s = re.sub(r'C:/Users/[^/]+/Documents/ai-reviewer', workspace, s, flags=re.IGNORECASE)
              return s
          for e in data:
              for k in ('directory','file','command','output'):
                  if k in e:
                      e[k] = fix_path(e[k])
          with open(dst, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          print('Normalized compilation database written to', dst)
          PY

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Provide compile_commands and PR metadata (if present) so SonarCloud can decorate PRs
          args: >
            --define "sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json"
            --define "sonar.pullrequest.key=${{ github.event.pull_request.number }}"
            --define "sonar.pullrequest.branch=${{ github.head_ref }}"
            --define "sonar.pullrequest.base=${{ github.base_ref }}"

      - name: Wait for SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PROJECT_KEY=vanderraad_ai-reviewer
          URL="https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT_KEY"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            URL="${URL}&pullRequest=${PR_NUMBER}"
            echo "Checking Quality Gate for PR #${PR_NUMBER}"
          else
            echo "Checking Quality Gate for project"
          fi
          echo "Polling SonarCloud for Quality Gate status..."
          for i in $(seq 1 40); do
            resp=$(curl -s -u "${SONAR_TOKEN}:" "$URL")
            status=$(echo "$resp" | jq -r .projectStatus.status)
            echo "Status: $status"
            if [ "$status" = "OK" ] || [ "$status" = "ERROR" ] || [ "$status" = "WARN" ]; then break; fi
            sleep 5
          done
          if [ "$status" != "OK" ]; then
            echo "Quality Gate failed: $status"
            echo "\nQuality Gate conditions:"
            echo "$resp" | jq -r '.projectStatus.conditions[] | "- \(.metricKey): \(.status) (actual=\(.actualValue) threshold=\(.errorThreshold) comparator=\(.comparator))"'
            echo "\nTop unresolved issues (BLOCKER/CRITICAL):"
            curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/issues/search?componentKeys=$PROJECT_KEY&resolved=false&severities=BLOCKER,CRITICAL&ps=5" | jq -r '.issues[] | "- [\(.severity)] \(.message) (\(.component):\(.line)  key=\(.key))"'
            echo "\nSee: https://sonarcloud.io/project/summary?id=$PROJECT_KEY"
            exit 1
          fi